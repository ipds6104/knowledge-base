defaultTs: bun
includes:
  - f/**
excludes:
  - "**/node_modules/**"
  - "**/.venv/**"
  - "**/__pycache__/**"
  - "**/*.tmp"
  - "**/*.log"
skipVariables: false
skipResources: false
skipResourceTypes: false
skipSecrets: true
skipScripts: false
skipFlows: false
skipApps: false
skipFolders: false
skipWorkspaceDependencies: false
skipDatatableMigrations: false
nonDottedPaths: true
syncBehavior: v1
codebases:
  - relative_path: f/shared
    includes:
      - "**"
    excludes: []
workspaces:
  admins:
    baseUrl: https://wind.dvlpid.my.id/
